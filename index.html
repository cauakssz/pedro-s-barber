<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Barbearia do Pedro</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/x-icon" href="./images/favicon.ico" />
  </head>
  <body>
    <main class="login-container">
      <div class="login__intro">
        <h1 class="login__title">Barbearia do Pedro</h1>
        <p class="login__subtitle">
          Estilo, confiança e tradição em cada corte
        </p>
      </div>

      <section class="login__content">
        <form id="login-form" class="login__form">
          <h2 class="login__heading">Acessar conta</h2>

          <div class="entry-group">
            <label for="email-input" class="entry-group__label">E-mail</label>
            <input
              type="email"
              id="email-input"
              class="entry-group__input"
              placeholder="Insira seu email"
            />
          </div>

          <div class="entry-group">
            <label for="password-input" class="entry-group__label">Senha</label>
            <input
              type="password"
              id="password-input"
              class="entry-group__input"
              placeholder="Insira sua senha"
            />
          </div>

          <div class="login__actions">
            <a href="./pagina.html" id="login-button" class="btn btn--primary">
              Entrar
            </a>
            <button type="button" id="register-button" class="btn btn--secondary">
              Cadastrar
            </button>
          </div>

          <a href="#" id="forget-password" class="login__link">
            Esqueci minha senha
          </a>
        </form>
      </section>
    </main>
  </body>
</html>
